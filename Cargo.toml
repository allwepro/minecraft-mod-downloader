[package]
name = "flux-project"
version = "1.0.0-beta"
edition = "2024"
authors = ["Flux Project Contributors"]
rust-version = "1.85.0"
description = "A GUI-based Minecraft Launcher and Resource Manager."

[[bin]]
name = "flux"
path = "src/main.rs"

[dependencies]
# async
tokio = { version = "1.49", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
parking_lot = "0.12.5"
# web
reqwest = { version = "0.13", features = ["json", "stream"] }
# fs
dirs = "6.0"
rfd = "0.16"
sha1 = "0.11.0-rc.4"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

# gui
egui = "0.32"
image = { version = "0.24", features = ["png", "webp"] }
eframe = "0.32"
egui_extras = { version = "0.32", features = ["image"] }
# serialization
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
bytes = "1.11.0"
# log
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
# other
strsim = "0.11"
lazy_static = "1.5.0"
# launcher
urlencoding = "2"
whoami = "1"
which = "6"
flate2 = "1.1.8"
tar = "0.4.44"
