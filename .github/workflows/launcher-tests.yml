name: Launcher Tests

on:
  push:
    branches:
      - feature/launcher
    paths:
      - 'src/launcher/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/launcher-tests.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'src/launcher/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/launcher-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-tests:
    name: Launcher Unit/Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Run launcher-only tests
        run: cargo test 'launcher::' --verbose
